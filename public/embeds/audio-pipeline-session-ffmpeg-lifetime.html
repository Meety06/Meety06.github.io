<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기존 AI 세션과 ffmpeg 디코더의 수명</title>
    <link rel="stylesheet" href="/embeds/recording-interactives.css" />
    <script src="/embeds/recording-embed-theme.js" defer></script>
    <style>
      :root {
        --surface-2: var(--surface);
        --border-strong: var(--border);
        --text-primary: var(--text);
        --text-secondary: var(--muted);
        --text-muted: var(--muted);
      }
      .lab {
        min-height: 0;
        overflow-x: auto;
      }
      #vis-container {
        min-width: 640px;
      }
    </style>
  </head>
  <body>
    <main class="lab">
      <div id="vis-container">
        <h2 class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">
          브라우저의 MediaRecorder가 만든 청크가 백엔드를 거쳐 AI 세션으로 가고, 세션마다 하나씩 띄운 ffmpeg이 PCM으로 바꿔 STT로 보내는
          파이프라인.
        </h2>
        <style>
          @keyframes dash {
            to {
              background-position: 20px 0;
            }
          }
          .pg {
            display: grid;
            grid-template-columns: 1fr 40px 1fr 40px 1fr 40px 1fr 40px 1fr;
            align-items: center;
          }
          .nd {
            border-radius: 10px;
            padding: 14px 8px;
            text-align: center;
            border: 0.5px solid;
            min-width: 0;
          }
          .nd b {
            display: block;
            font-size: 14px;
          }
          .nd span {
            display: block;
            font-size: 11px;
            margin-top: 3px;
            opacity: 0.75;
          }
          .lk {
            height: 2px;
            margin-right: 9px;
            background-image: linear-gradient(90deg, var(--border-strong) 0 10px, transparent 10px 20px);
            background-size: 20px 2px;
            animation: dash 0.9s linear infinite;
            position: relative;
          }
          .lk::after {
            content: '';
            position: absolute;
            right: -9px;
            top: -6px;
            border-left: 10px solid var(--border-strong);
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
          }
          .cap {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            justify-self: center;
          }
          @media (prefers-reduced-motion: reduce) {
            .lk {
              animation: none;
            }
          }
        </style>
        <div class="pg" style="padding: 4px 0">
          <div
            style="
              grid-column: 8;
              grid-row: 1;
              justify-self: center;
              white-space: nowrap;
              font-size: 11px;
              color: var(--text-muted);
              padding-bottom: 5px;
            "
          >
            PCM
          </div>

          <div
            class="nd"
            style="
              grid-column: 1;
              grid-row: 2;
              background: var(--surface-2);
              border-color: var(--border-strong);
              color: var(--text-primary);
            "
          >
            <b>Browser</b><span>MediaRecorder</span>
          </div>
          <div class="lk" style="grid-column: 2; grid-row: 2"></div>
          <div class="nd" style="grid-column: 3; grid-row: 2; background: #0f6e56; border-color: #1d9e75; color: #e8faf3">
            <b>BE</b><span>중계</span>
          </div>
          <div class="lk" style="grid-column: 4; grid-row: 2"></div>
          <div class="nd" style="grid-column: 5; grid-row: 2; background: #4b3fb8; border-color: #6b5fd6; color: #f0eefc">
            <b>AI 세션</b><span>세션 단위</span>
          </div>
          <div class="lk" style="grid-column: 6; grid-row: 2"></div>
          <div class="nd" style="grid-column: 7; grid-row: 2; background: #4b3fb8; border-color: #6b5fd6; color: #f0eefc">
            <b>ffmpeg</b><span>디코딩</span>
          </div>
          <div class="lk" style="grid-column: 8; grid-row: 2"></div>
          <div class="nd" style="grid-column: 9; grid-row: 2; background: #0c4f84; border-color: #1a6fb0; color: #e8f2fb">
            <b>STT</b><span>전사 생성</span>
          </div>

          <div
            style="
              grid-column: 5 / 8;
              grid-row: 3;
              height: 12px;
              margin-top: 8px;
              border: 0.5px dashed var(--border-strong);
              border-top: none;
              border-radius: 0 0 8px 8px;
            "
          ></div>

          <div class="cap" style="grid-column: 5 / 8; grid-row: 4; margin-top: 8px">세션 하나 = ffmpeg 하나 · 수명이 같다</div>
        </div>
      </div>
    </main>
  </body>
</html>
