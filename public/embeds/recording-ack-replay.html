<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IndexedDB 청크 수신 상태</title>
  <link rel="stylesheet" href="/embeds/recording-interactives.css" />
  <script src="/embeds/recording-embed-theme.js" defer></script>
  <script src="/embeds/recording-embed-resize.js" defer></script>
  <style>
    @font-face { font-family: 'Pretendard Variable'; src: url('/fonts/PretendardVariable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('/fonts/GeistVF.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    html, body { min-height: 0; }
    body { font-family: 'Geist', 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; }
    .lab { min-height: 0; padding: 20px; border-radius: 14px; background: var(--surface); }
    .top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 15px; }
    .top h1 { margin: 0; color: var(--text); font-size: 18px; font-weight: 750; line-height: 1.4; }
    .top p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .controls { gap: 5px; margin: 0; }
    .controls button { min-height: 34px; padding: 5px 10px; border-radius: 8px; font-size: 12px; }
    .table-wrap { overflow: hidden; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; text-align: left; }
    th { padding: 10px 15px; border-bottom: 1px solid var(--border); background: var(--bg); color: var(--muted); font-weight: 650; }
    td { padding: 10px 15px; border-bottom: 1px solid var(--border); color: var(--text); }
    tbody tr:last-child td { border-bottom: 0; }
    .seq { font-weight: 700; }
    .status { display: inline-flex; align-items: center; min-width: 72px; justify-content: center; padding: 3px 8px; border-radius: 6px; background: var(--orange-soft); color: var(--orange); font-size: 12px; font-weight: 700; }
    tr.acked .status { background: var(--green-soft); color: var(--green); }
    tr.resend { background: var(--orange-soft); }
    tr.resend .seq::after { content: '  ↗ 재전송'; color: var(--orange); font-size: 11px; font-weight: 700; }
    .activity { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 8px; margin-top: 12px; padding: 11px 13px; border-radius: 7px; background: var(--accent-soft); font-size: 13px; line-height: 1.6; }
    .activity strong { color: var(--accent); font-weight: 700; }
    .activity span { color: var(--muted); }
    @media (max-width: 530px) {
      .lab { padding: 16px; }
      .top h1 { font-size: 17px; }
      .controls button { font-size: 11px; padding-inline: 8px; }
      th, td { padding-inline: 10px; }
      tr.resend .seq::after { display: block; }
    }
  </style>
</head>
<body>
  <main class="lab">
    <div class="top">
      <div><h1>IndexedDB에 남긴 청크</h1><p>녹음 세션 하나의 수신 상태 예시</p></div>
      <div class="controls" role="group" aria-label="청크 수신 확인 단계">
        <button type="button" data-stage="stored" aria-pressed="true">저장</button>
        <button type="button" data-stage="acked" aria-pressed="false">ACK 40</button>
        <button type="button" data-stage="replay" aria-pressed="false">재연결</button>
      </div>
    </div>
    <div class="table-wrap">
      <table aria-label="IndexedDB에 저장한 청크와 수신 확인 상태">
        <thead><tr><th scope="col">청크 순번</th><th scope="col">BE 수신 상태</th></tr></thead>
        <tbody>
          <tr data-seq="39"><td class="seq">#39</td><td><span class="status">pending</span></td></tr>
          <tr data-seq="40"><td class="seq">#40</td><td><span class="status">pending</span></td></tr>
          <tr data-seq="41"><td class="seq">#41</td><td><span class="status">pending</span></td></tr>
          <tr data-seq="42"><td class="seq">#42</td><td><span class="status">pending</span></td></tr>
        </tbody>
      </table>
    </div>
    <div class="activity" aria-live="polite"><strong id="activity-title">청크 저장</strong><span id="activity-text">아직 BE 수신을 확인하지 못했으므로 모두 pending입니다.</span></div>
  </main>
  <script>
    const stages = {
      stored: { ackedThrough: 38, resend: [], title: '청크 저장', text: '아직 BE 수신을 확인하지 못했으므로 모두 pending입니다.' },
      acked: { ackedThrough: 40, resend: [], title: 'ACK 40 수신', text: 'BE가 40번까지 처리했습니다. 39·40번을 acked로 바꿉니다.' },
      replay: { ackedThrough: 40, resend: [41, 42], title: '인터넷 재연결', text: '남은 pending 41·42번만 다시 보냅니다. ACK 전까지는 pending으로 남습니다.' },
    };
    document.querySelectorAll('[data-stage]').forEach((button) => {
      button.addEventListener('click', () => {
        const stage = stages[button.dataset.stage];
        document.querySelectorAll('[data-stage]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        document.querySelectorAll('tbody tr').forEach((row) => {
          const seq = Number(row.dataset.seq);
          const acked = seq <= stage.ackedThrough;
          row.classList.toggle('acked', acked);
          row.classList.toggle('resend', stage.resend.includes(seq));
          row.querySelector('.status').textContent = acked ? 'acked' : 'pending';
        });
        document.getElementById('activity-title').textContent = stage.title;
        document.getElementById('activity-text').textContent = stage.text;
      });
    });
  </script>
</body>
</html>
