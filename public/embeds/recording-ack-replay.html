<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IndexedDB 청크 수신 상태</title>
  <link rel="stylesheet" href="/embeds/recording-interactives.css" />
  <script src="/embeds/recording-embed-theme.js" defer></script>
  <script src="/embeds/recording-embed-resize.js" defer></script>
  <style>
    @font-face { font-family: 'Pretendard Variable'; src: url('/fonts/PretendardVariable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('/fonts/GeistVF.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    html, body { min-height: 0; }
    body { font-family: 'Geist', 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; }
    .lab { min-height: 0; padding: 20px; border-radius: 14px; background: var(--surface); }
    .top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 15px; }
    .top h1 { margin: 0; color: var(--text); font-size: 18px; font-weight: 750; line-height: 1.4; }
    .top p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .controls { gap: 5px; margin: 0; }
    .controls button { min-height: 34px; padding: 5px 10px; border-radius: 8px; font-size: 12px; }
    .diagram { margin-bottom: 14px; padding: 6px 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
    .diagram svg { display: block; width: 100%; height: auto; }
    .diagram .narrow { display: none; }
    .node rect { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .node.ws rect { fill: var(--accent-soft); stroke: var(--accent); }
    .node.be rect { fill: var(--green-soft); stroke: var(--green); }
    .node.idb rect { fill: var(--surface); stroke: var(--green); stroke-width: 1.5; }
    .node-title { fill: var(--text); font-size: 14px; font-weight: 700; text-anchor: middle; }
    .node-sub { fill: var(--muted); font-size: 11px; text-anchor: middle; }
    .edge { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow-idle); transition: stroke .2s; }
    .edge.on { animation: flow .7s linear infinite; }
    .edge.on.send { stroke: var(--accent); marker-end: url(#arrow-accent); }
    .edge.on.save, .edge.on.ack { stroke: var(--green); marker-end: url(#arrow-green); }
    .edge.on.resend { stroke: var(--orange); marker-end: url(#arrow-orange); }
    .edge-label { fill: var(--muted); font-size: 11px; font-weight: 700; opacity: .55; transition: opacity .2s; }
    .edge-label.on { opacity: 1; }
    .edge-label.on.save, .edge-label.on.ack { fill: var(--green); }
    .edge-label.on.resend { fill: var(--orange); }
    #arrow-idle path { fill: var(--border); }
    #arrow-accent path { fill: var(--accent); }
    #arrow-green path { fill: var(--green); }
    #arrow-orange path { fill: var(--orange); }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .table-wrap { overflow: hidden; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; text-align: left; }
    th { padding: 10px 15px; border-bottom: 1px solid var(--border); background: var(--bg); color: var(--muted); font-weight: 650; }
    td { padding: 10px 15px; border-bottom: 1px solid var(--border); color: var(--text); }
    tbody tr:last-child td { border-bottom: 0; }
    .seq { font-weight: 700; }
    .status { display: inline-flex; align-items: center; min-width: 72px; justify-content: center; padding: 3px 8px; border-radius: 6px; background: var(--orange-soft); color: var(--orange); font-size: 12px; font-weight: 700; }
    tr.acked .status { background: var(--green-soft); color: var(--green); }
    tr.resend { background: var(--orange-soft); }
    tr.resend .seq::after { content: '  ↗ 재전송'; color: var(--orange); font-size: 11px; font-weight: 700; }
    .activity { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 8px; margin-top: 12px; padding: 11px 13px; border-radius: 7px; background: var(--accent-soft); font-size: 13px; line-height: 1.6; }
    .activity strong { color: var(--accent); font-weight: 700; }
    .activity span { color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .edge.on { animation: none; } }
    @media (max-width: 560px) {
      .lab { padding: 16px; }
      .top h1 { font-size: 17px; }
      .controls button { font-size: 11px; padding-inline: 8px; }
      .diagram .wide { display: none; }
      .diagram .narrow { display: block; }
      th, td { padding-inline: 10px; }
      tr.resend .seq::after { display: block; }
    }
  </style>
</head>
<body>
  <main class="lab">
    <div class="top">
      <div><h1>IndexedDB에 남긴 청크</h1><p>녹음 세션 하나의 수신 상태 예시</p></div>
      <div class="controls" role="group" aria-label="청크 수신 확인 단계">
        <button type="button" data-stage="stored" aria-pressed="true">저장</button>
        <button type="button" data-stage="acked" aria-pressed="false">ACK 40</button>
        <button type="button" data-stage="replay" aria-pressed="false">재연결</button>
      </div>
    </div>
    <div class="diagram">
      <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <defs>
          <marker id="arrow-idle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker>
          <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" /></marker>
        </defs>
      </svg>
      <svg class="wide" viewBox="0 0 720 236" role="img" aria-label="브라우저는 청크를 WebSocket으로 보내는 동시에 IndexedDB에 저장하고, 서버의 ACK로 상태를 바꾸며, 재연결 때 pending 청크를 IndexedDB에서 다시 보냅니다.">
        <path class="edge send" data-edge="send-a" d="M180 54H274" />
        <path class="edge send" data-edge="send-b" d="M440 54H534" />
        <path class="edge save" data-edge="save" d="M100 84V188H274" />
        <path class="edge ack" data-edge="ack" d="M620 84V188H446" />
        <path class="edge resend" data-edge="resend" d="M360 156V90" />
        <text class="edge-label save" data-edge="save" x="190" y="178" text-anchor="middle">pending 저장</text>
        <text class="edge-label ack" data-edge="ack" x="532" y="178" text-anchor="middle">ACK 40</text>
        <text class="edge-label resend" data-edge="resend" x="372" y="127">pending 재전송</text>
        <g class="node"><rect x="20" y="24" width="160" height="60" rx="10" /><text class="node-title" x="100" y="50">브라우저</text><text class="node-sub" x="100" y="69">청크 생성 · seq 부여</text></g>
        <g class="node ws"><rect x="280" y="24" width="160" height="60" rx="10" /><text class="node-title" x="360" y="50">WebSocket</text><text class="node-sub" x="360" y="69">실시간 전송</text></g>
        <g class="node be"><rect x="540" y="24" width="160" height="60" rx="10" /><text class="node-title" x="620" y="50">서버</text><text class="node-sub" x="620" y="69">처리한 순번 ACK</text></g>
        <g class="node idb"><rect x="280" y="156" width="160" height="64" rx="10" /><text class="node-title" x="360" y="183">IndexedDB</text><text class="node-sub" data-idb-summary x="360" y="203">pending 4</text></g>
      </svg>
      <svg class="narrow" viewBox="0 0 340 324" role="img" aria-label="브라우저는 청크를 WebSocket으로 보내는 동시에 IndexedDB에 저장하고, 서버의 ACK로 상태를 바꾸며, 재연결 때 pending 청크를 IndexedDB에서 다시 보냅니다.">
        <path class="edge send" data-edge="send-a" d="M86 72V130" />
        <path class="edge send" data-edge="send-b" d="M86 192V250" />
        <path class="edge save" data-edge="save" d="M156 44H265V130" />
        <path class="edge ack" data-edge="ack" d="M156 284H265V198" />
        <path class="edge resend" data-edge="resend" d="M206 164H162" />
        <text class="edge-label save" data-edge="save" x="210" y="36" text-anchor="middle">pending 저장</text>
        <text class="edge-label ack" data-edge="ack" x="210" y="302" text-anchor="middle">ACK 40</text>
        <text class="edge-label resend" data-edge="resend" x="183" y="155" text-anchor="middle">재전송</text>
        <g class="node"><rect x="16" y="16" width="140" height="56" rx="10" /><text class="node-title" x="86" y="40">브라우저</text><text class="node-sub" x="86" y="58">청크 생성 · seq 부여</text></g>
        <g class="node ws"><rect x="16" y="136" width="140" height="56" rx="10" /><text class="node-title" x="86" y="160">WebSocket</text><text class="node-sub" x="86" y="178">실시간 전송</text></g>
        <g class="node be"><rect x="16" y="256" width="140" height="56" rx="10" /><text class="node-title" x="86" y="280">서버</text><text class="node-sub" x="86" y="298">처리한 순번 ACK</text></g>
        <g class="node idb"><rect x="206" y="136" width="118" height="56" rx="10" /><text class="node-title" x="265" y="160">IndexedDB</text><text class="node-sub" data-idb-summary x="265" y="178">pending 4</text></g>
      </svg>
    </div>
    <div class="table-wrap">
      <table aria-label="IndexedDB에 저장한 청크와 수신 확인 상태">
        <thead><tr><th scope="col">청크 순번</th><th scope="col">서버 수신 상태</th></tr></thead>
        <tbody>
          <tr data-seq="39"><td class="seq">#39</td><td><span class="status">pending</span></td></tr>
          <tr data-seq="40"><td class="seq">#40</td><td><span class="status">pending</span></td></tr>
          <tr data-seq="41"><td class="seq">#41</td><td><span class="status">pending</span></td></tr>
          <tr data-seq="42"><td class="seq">#42</td><td><span class="status">pending</span></td></tr>
        </tbody>
      </table>
    </div>
    <div class="activity" aria-live="polite"><strong id="activity-title">청크 저장</strong><span id="activity-text">청크를 서버로 보내면서 IndexedDB에도 pending으로 저장합니다.</span></div>
  </main>
  <script>
    const stages = {
      stored: { edges: ['send-a', 'send-b', 'save'], ackedThrough: 38, resend: [], idb: 'pending 4', title: '청크 저장', text: '청크를 서버로 보내면서 IndexedDB에도 pending으로 저장합니다.' },
      acked: { edges: ['ack'], ackedThrough: 40, resend: [], idb: 'acked 2 · pending 2', title: 'ACK 40 수신', text: '서버가 40번까지 처리했습니다. IndexedDB에서 39·40번을 acked로 바꿉니다.' },
      replay: { edges: ['resend', 'send-b'], ackedThrough: 40, resend: [41, 42], idb: 'pending 41·42 조회', title: '인터넷 재연결', text: 'IndexedDB에서 남은 pending 41·42번만 꺼내 다시 보냅니다. ACK 전까지는 pending으로 남습니다.' },
    };
    document.querySelectorAll('[data-stage]').forEach((button) => {
      button.addEventListener('click', () => {
        const stage = stages[button.dataset.stage];
        document.querySelectorAll('[data-stage]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        document.querySelectorAll('[data-edge]').forEach((edge) => edge.classList.toggle('on', stage.edges.includes(edge.dataset.edge)));
        document.querySelectorAll('[data-idb-summary]').forEach((summary) => { summary.textContent = stage.idb; });
        document.querySelectorAll('tbody tr').forEach((row) => {
          const seq = Number(row.dataset.seq);
          const acked = seq <= stage.ackedThrough;
          row.classList.toggle('acked', acked);
          row.classList.toggle('resend', stage.resend.includes(seq));
          row.querySelector('.status').textContent = acked ? 'acked' : 'pending';
        });
        document.getElementById('activity-title').textContent = stage.title;
        document.getElementById('activity-text').textContent = stage.text;
      });
    });
    document.querySelector('[data-stage][aria-pressed="true"]').click();
  </script>
</body>
</html>
