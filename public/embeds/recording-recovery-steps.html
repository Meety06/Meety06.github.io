<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAC 인코딩 복구 순서</title>
  <link rel="stylesheet" href="/embeds/recording-interactives.css" />
  <script src="/embeds/recording-embed-theme.js" defer></script>
</head>
<body>
  <main class="lab">
    <p class="eyebrow">REFRESH RECOVERY</p>
    <h1>새 인코더를 어디서부터 시작할까요?</h1>
    <p class="muted">단계를 눌러 저장된 AAC와 새 출력이 이어지는 과정을 확인합니다.</p>
    <div class="controls" role="group" aria-label="인코딩 복구 단계">
      <button type="button" data-step="0" aria-pressed="true">1. 확정 지점</button>
      <button type="button" data-step="1" aria-pressed="false">2. 조금 앞부터</button>
      <button type="button" data-step="2" aria-pressed="false">3. 중복 제외</button>
      <button type="button" data-step="3" aria-pressed="false">4. 이어 저장</button>
    </div>
    <div class="panel" aria-live="polite">
      <strong id="step-title">저장된 마지막 AAC 프레임의 끝을 E로 정합니다.</strong>
      <p class="note" id="step-copy">E 이전은 이미 IndexedDB에 확정되어 있습니다. 새로고침으로 인코더가 사라져도 이 지점은 남습니다.</p>
      <div class="steps" id="timeline" aria-label="AAC 복구 흐름">
        <span class="step active">저장된 AAC</span>
        <span class="step">E − 여유분</span>
        <span class="step">E</span>
        <span class="step">새 AAC</span>
      </div>
    </div>
    <p class="note">여유분은 48kHz AAC 프레임 10개, 약 213ms입니다. 그림은 알고리즘 설명이며 오디오 시간을 비율대로 그린 것은 아닙니다.</p>
  </main>
  <script>
    const stages = [
      {
        title: '저장된 마지막 AAC 프레임의 끝을 E로 정합니다.',
        copy: 'E 이전은 이미 IndexedDB에 확정되어 있습니다. 새로고침으로 인코더가 사라져도 이 지점은 남습니다.',
      },
      {
        title: 'E보다 약 213ms 앞의 PCM부터 다시 넣습니다.',
        copy: '새 인코더가 앞 문맥을 받을 수 있도록 원본 PCM을 조금 겹쳐 읽습니다. 저장된 프레임이 없다면 처음부터 시작합니다.',
      },
      {
        title: '새 출력 중 E 이전 프레임을 버립니다.',
        copy: '겹친 구간을 다시 만들되 파일에는 두 번 넣지 않습니다. 타임스탬프를 48kHz 샘플 위치로 비교합니다.',
      },
      {
        title: 'E부터 나온 프레임만 기존 AAC 뒤에 보관합니다.',
        copy: '복구 중 새로 들어온 PCM은 순서대로 기다렸다가, 이전 PCM 처리가 끝난 뒤 같은 인코더에 입력합니다.',
      },
    ];
    const buttons = [...document.querySelectorAll('[data-step]')];
    function showStep(index) {
      buttons.forEach((button, buttonIndex) => {
        button.setAttribute('aria-pressed', String(buttonIndex === index));
      });
      document.getElementById('step-title').textContent = stages[index].title;
      document.getElementById('step-copy').textContent = stages[index].copy;
      [...document.querySelectorAll('#timeline .step')].forEach((item, itemIndex) => {
        item.className = 'step ' + (itemIndex < index ? 'past' : itemIndex === index ? 'active' : '');
      });
    }
    buttons.forEach((button) => {
      button.addEventListener('click', () => showStep(Number(button.dataset.step)));
    });
  </script>
</body>
</html>
